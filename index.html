<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AberturasPro CAD – Ingeniería y Optimización en Aluminio | Línea Niza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <aside id="side">
    <div class="brand">
      <div class="brand-icon"><i class="bi bi-bounding-box-circles"></i></div>
      <div>
        <span>AberturasPro <small class="badge-ver">CAD</small></span>
        <small>Línea Niza · Alsafex Tech</small>
      </div>
    </div>
    <div class="nav-label">PRODUCCIÓN & INGENIERÍA</div>
    <nav id="nav"></nav>
    <div class="side-footer">
      <div class="spec-pill"><i class="bi bi-disc"></i> Disco sierra: <b>3.0 mm</b></div>
      <div class="spec-pill"><i class="bi bi-recycle"></i> Recupero mín: <b>500 mm</b></div>
    </div>
  </aside>

  <main>
    <header class="top">
      <div class="d-flex align-items-center gap-3">
        <h5 id="title" class="m-0 fw-bold text-dark"></h5>
        <span class="tech-tag d-none d-md-inline-flex"><i class="bi bi-cpu"></i> Motor 1D FFD v3.2</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-outline-secondary" onclick="resetDemo()">
          <i class="bi bi-arrow-counterclockwise"></i> Restaurar datos
        </button>
        <div class="user-chip">
          <i class="bi bi-person-badge"></i> Oficina Técnica
        </div>
      </div>
    </header>
    <section id="view" class="p-4"></section>
  </main>

  <div class="modal fade" id="m" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-slate-900 text-white">
          <h6 class="modal-title fw-bold" id="mt"></h6>
          <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body bg-light" id="mb"></div>
        <div class="modal-footer bg-white" id="mf"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
